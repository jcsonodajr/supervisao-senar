<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisão de Instrutoria - SENAR</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print { .no-print { display: none !important; } }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("Service Worker Registrado"));
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 p-2 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto bg-white p-4 md:p-8 rounded-lg shadow-md" id="relatorio-pdf">
        
        <div class="border-b-2 border-green-600 pb-4 mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-green-700">Supervisão de Instrutoria</h1>
            <p class="text-sm text-gray-500 mt-1">Instrumento de Avaliação de Desempenho e Metodologia</p>
        </div>

        <form id="supervisao-form">
            <div id="blocos-avaliacao"></div>

            <div class="mt-8 space-y-6">
                <div>
                    <label class="block font-bold text-gray-700 mb-2">Rascunho de Campo (Observações brutas para a IA)</label>
                    <textarea id="rascunho" class="w-full border p-3 rounded focus:ring-green-500 focus:border-green-500" rows="3" placeholder="Digite aqui os detalhes e justificativas rápidas das notas para que a IA gere os textos finais..."></textarea>
                </div>

                <div>
                    <label class="block font-bold text-green-700 mb-2">Aspectos positivos da instrutoria</label>
                    <textarea id="aspectos_positivos" name="aspectos_positivos" class="w-full border p-3 rounded bg-green-50" rows="4"></textarea>
                </div>

                <div>
                    <label class="block font-bold text-orange-700 mb-2">Aspectos discutidos para melhoria do desempenho e sugestões</label>
                    <textarea id="aspectos_melhoria" name="aspectos_melhoria" class="w-full border p-3 rounded bg-orange-50" rows="4"></textarea>
                </div>
            </div>
        </form>

        <div class="mt-8 flex flex-wrap gap-4 no-print border-t pt-6">
            <button onclick="refinarComIA()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded shadow flex-1 md:flex-none">Refinar Textos com IA</button>
            <button onclick="gerarPDF()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded shadow flex-1 md:flex-none">Baixar PDF</button>
            <button onclick="exportarJSON()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded shadow flex-1 md:flex-none">Exportar para Python/Selenium</button>
        </div>
    </div>

    <script>
        const escala = [
            { valor: 4, label: "Sim, plenamente" },
            { valor: 3, label: "Sim, parcialmente" },
            { valor: 2, label: "Precisa melhorar" },
            { valor: 1, label: "Não" },
            { valor: 0, label: "Não observado" }
        ];

        const questionario = [
            {
                categoria: "Objetivos",
                itens: [
                    "Apresentou, aos participantes, os objetivos instrucionais ou os resultados esperados.",
                    "Seguiu os objetivos planejados, numa sequência lógica."
                ]
            },
            {
                categoria: "Conteúdo programático",
                itens: [
                    "Seguiu a sequência planejada para desenvolvimento do conteúdo.",
                    "Usou exemplos baseados em situações vivenciadas pelos participantes.",
                    "Desenvolveu o conteúdo dentro do tempo previsto.",
                    "A parte teórica desenvolveu-se conjuntamente á prática.",
                    "Compatibilizou o conteúdo com interesses e necessidades dos participantes.",
                    "Ao iniciar novo conteúdo, apresentou a sua relação com outros já abordados.",
                    "Demonstrou segurança em seus posicionamentos.",
                    "Utilizou a linguagem escrita e oral corretamente.",
                    "Foi claro e objetivo na exposição dos assuntos.",
                    "Abordou questões relacionadas a saúde e segurança do trabalhador e/ou aspectos sobre meio ambiente, cidadania, qualidade e produtividade, sempre que pertinentes.",
                    "Decodificou os termos técnicos, quando utilizados.",
                    "Evidenciou a aplicabilidade prática do conteúdo ministrado."
                ]
            },
            {
                categoria: "Desenvolvimentos das técnicas instrucionais",
                itens: [
                    "Dominou técnicas instrucionais aplicadas.",
                    "As técnicas utilizadas foram apropriadas ao conteúdo ministrado.",
                    "As técnicas utilizadas foram compatíveis com as características dos participantes."
                ]
            },
            {
                categoria: "Recursos Instrucionais",
                itens: [
                    "Os recursos instrucionais necessários para o desenvolvimento do evento foram conferidos e testados.",
                    "Foram utilizados no momento oportuno.",
                    "Facilitaram a compreensão do assunto.",
                    "Foram disponibilizados na quantidade apropriada ao número de participantes.",
                    "Foram adequados às características dos participantes.",
                    "Apresentaram bom estado de conservação, sem defeitos comprometedores para a aprendizagem.",
                    "Estavam adequados ao local do evento."
                ]
            },
            {
                categoria: "Avaliação",
                itens: [
                    "Aplicou: diagnóstica, formativa somativa.",
                    "Os procedimentos de avaliação foram compatíveis com as características dos participantes.",
                    "Informou aos participantes sobre seus acertos e erros, apresentando-lhes respostas/comportamento corretos."
                ]
            },
            {
                categoria: "Plano instrucional",
                itens: [
                    "Portou o plano instrucional em formato físico.",
                    "Seguiu o plano instrucional elaborado.",
                    "Participou da elaboração do plano instrucional.",
                    "Necessitou ajustar/modificar o plano instrucional."
                ]
            },
            {
                categoria: "Postura do instrutor",
                itens: [
                    "Informou os critérios para a certificação.",
                    "Apresentou coerência entre o que apontava como correto e o que executava perante a turma.",
                    "Estabeleceu contrato psicológico e o afixou em local visível durante o evento.",
                    "Forneceu as informações necessárias para que os participantes apresentassem comportamento esperado.",
                    "Estabeleceu um bom relacionamento com os participantes.",
                    "Realizou as práticas de forma que todos os participantes conseguissem visualizá-las.",
                    "Exerceu liderança perante a turma, estabelecendo um clima de organização.",
                    "Deu oportunidade a todos os participantes de realizarem cada prática.",
                    "Foi hábil e criativo na resolução de problema.",
                    "Supervisionou a atividade prática realizada por cada participante.",
                    "Foi pontual.",
                    "Preocupou-se com sua aparência pessoal.",
                    "Foi assíduo.",
                    "Preocupou-se em utilizar traje adequado à situação de trabalho em que encontrava.",
                    "Estimulou a participação ativa dos participantes.",
                    "Orientou quanto aos recursos necessários a serem providenciados pelos participantes.",
                    "Valorizou os participantes pelo desempenho correto nas práticas e/ou na resolução de problemas propostos.",
                    "Organizou o espaço físico.",
                    "Socializou as respostas das perguntas individuais."
                ]
            }
        ];

        function renderizarQuestionario() {
            const container = document.getElementById('blocos-avaliacao');
            let html = '';

            questionario.forEach((bloco, bIndex) => {
                html += `<div class="mb-8"><h2 class="text-lg md:text-xl font-bold bg-green-100 text-green-800 p-3 rounded mb-4">${bloco.categoria}</h2>`;
                
                bloco.itens.forEach((item, iIndex) => {
                    const fieldId = `q_${bIndex}_${iIndex}`;
                    html += `<div class="mb-4 pb-4 border-b border-gray-200">
                                <p class="text-gray-700 mb-3 font-medium text-sm md:text-base leading-snug">${item}</p>
                                <div class="flex flex-wrap gap-2 md:gap-4">`;
                    
                    escala.forEach(esc => {
                        html += `<label class="flex items-center space-x-2 bg-gray-50 px-3 py-2 rounded-lg border cursor-pointer hover:bg-green-50 transition-colors">
                                    <input type="radio" name="${fieldId}" value="${esc.valor}" class="form-radio text-green-600 h-4 w-4" onchange="salvarDados()">
                                    <span class="text-xs md:text-sm text-gray-700 font-semibold">${esc.valor} - ${esc.label}</span>
                                 </label>`;
                    });
                    
                    html += `</div></div>`;
                });
                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function salvarDados() {
            const formData = new FormData(document.getElementById('supervisao-form'));
            const data = Object.fromEntries(formData.entries());
            data.rascunho = document.getElementById('rascunho').value;
            data.aspectos_positivos = document.getElementById('aspectos_positivos').value;
            data.aspectos_melhoria = document.getElementById('aspectos_melhoria').value;
            localStorage.setItem('supervisaoSENAR', JSON.stringify(data));
        }

        function carregarDados() {
            const dadosSalvos = JSON.parse(localStorage.getItem('supervisaoSENAR'));
            if (!dadosSalvos) return;

            Object.entries(dadosSalvos).forEach(([key, value]) => {
                const el = document.querySelector(`[name="${key}"][value="${value}"]`);
                if (el) el.checked = true;
            });
            document.getElementById('rascunho').value = dadosSalvos.rascunho || '';
            document.getElementById('aspectos_positivos').value = dadosSalvos.aspectos_positivos || '';
            document.getElementById('aspectos_melhoria').value = dadosSalvos.aspectos_melhoria || '';
        }

        ['rascunho', 'aspectos_positivos', 'aspectos_melhoria'].forEach(id => {
            document.getElementById(id).addEventListener('input', salvarDados);
        });

        async function refinarComIA() {
            const rascunho = document.getElementById('rascunho').value;
            if(!rascunho) {
                alert("Preencha o rascunho de campo para gerar o contexto da IA.");
                return;
            }
            alert("Enviando notas e rascunho para a Gemini API...\n\n(A integração da chave de API será configurada nesta etapa para redigir o texto automaticamente baseado nos manuais de FPR e Mobilização).");
        }

        function gerarPDF() {
            const elemento = document.getElementById('relatorio-pdf');
            const opt = {
                margin:       10,
                filename:     'Relatorio_Supervisao_SENAR.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(elemento).save();
        }

        function exportarJSON() {
            const dados = localStorage.getItem('supervisaoSENAR');
            if(!dados) {
                alert("Nenhum dado para exportar.");
                return;
            }
            const blob = new Blob([dados], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'payload_automacao.json';
            a.click();
        }

        window.onload = () => {
            renderizarQuestionario();
            carregarDados();
        };
    </script>
</body>
</html>
